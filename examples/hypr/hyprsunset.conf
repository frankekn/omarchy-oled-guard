# Copy to ~/.config/hypr/hyprsunset.conf (then run: omarchy restart hyprsunset)
# Daytime: subtle 5700K paper-white warmth softens the harsh OLED blue peak without turning reddish.
profile {
    time = 07:00
    temperature = 5700
}

# Evening: comfortable 4800K warmth.
profile {
    time = 19:00
    temperature = 4800
}
