# Copy to /etc/limine-entry-tool.d/xe-oled-no-psr.conf, then run: sudo limine-mkinitcpio
# For Intel Lunar Lake / Panther Lake (xe driver): disables PSR and Panel Replay
# to eliminate subtle voltage/luminance jumps between static and scrolling frames.
KERNEL_CMDLINE[default]+=" xe.enable_psr=0 xe.enable_panel_replay=0"
